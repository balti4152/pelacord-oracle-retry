name: Crear máquina de Oracle

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: oracle-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet oci
      - id: try
        env:
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ vars.OCI_TENANCY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: python retry.py
      # Salió: avisa con un issue (llega por mail) y apaga esta tarea.
      - if: steps.try.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          IP: ${{ steps.try.outputs.ip }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "¡La máquina de Oracle está lista! IP: $IP" --body "La máquina Pelacord se creó. IP pública: $IP"
          gh workflow disable retry.yml --repo "$GITHUB_REPOSITORY"
