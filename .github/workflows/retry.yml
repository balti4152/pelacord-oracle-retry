name: Crear máquina de Oracle

# Cada corrida prueba crear la máquina cada ~3,5 minutos durante ~5,5 horas y, si todavía no salió,
# se vuelve a lanzar sola. El reloj de GitHub ("schedule") queda de respaldo por si la cadena se corta.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: oracle-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install --quiet oci
      - id: try
        env:
          OCI_USER: ${{ vars.OCI_USER }}
          OCI_FINGERPRINT: ${{ vars.OCI_FINGERPRINT }}
          OCI_TENANCY: ${{ vars.OCI_TENANCY }}
          OCI_REGION: ${{ vars.OCI_REGION }}
          OCI_STACK_ID: ${{ vars.OCI_STACK_ID }}
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: python retry.py loop 330 210
      # Salió: avisa con un issue (llega por mail, sin datos de la máquina) y apaga esta tarea.
      - if: steps.try.outputs.done == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" --title "¡La máquina de Oracle está lista!" --body "La máquina Pelacord se creó. Avisale a Claude para que siga."
          gh workflow disable retry.yml --repo "$GITHUB_REPOSITORY"
      # No salió todavía: se vuelve a lanzar.
      - if: steps.try.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run retry.yml --repo "$GITHUB_REPOSITORY" --ref main
